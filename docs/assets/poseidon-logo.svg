<svg xmlns="http://www.w3.org/2000/svg" width="520" height="128" viewBox="0 0 520 128" role="img" aria-label="Poseidon-CLI Logo">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040d16" />
      <stop offset="100%" stop-color="#092136" />
    </linearGradient>
    <linearGradient id="tridentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdff" />
      <stop offset="38%" stop-color="#38e8ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdff" />
      <stop offset="52%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="516" height="124" rx="18" fill="url(#bgGrad)" stroke="#38e8ff" stroke-opacity="0.38" stroke-width="1.5" />

  <!-- Subtle radial bioluminescent halo behind trident -->
  <circle cx="76" cy="64" r="42" fill="#38e8ff" fill-opacity="0.11" />

  <!-- Cyber-Mythology Barbed Trident -->
  <g transform="translate(42, 20) scale(1.08)" filter="url(#glow)">
    <path d="M32 3 L38 17 L34.5 15 L34.5 68 L32 76 L29.5 68 L29.5 15 L26 17 Z" fill="url(#tridentGrad)" />
    <path d="M32 9 L33.2 21 L32 23 L30.8 21 Z" fill="#ffffff" opacity="0.92" />
    <path d="M12 11 L19.5 21 L16 20.5 C16.5 31 20 37.5 29.5 39 L29.5 43.5 C16.8 42 11.2 33.5 11.5 19.5 L8 21 Z" fill="url(#tridentGrad)" />
    <path d="M52 11 L56 21 L52.5 19.5 C52.8 33.5 47.2 42 34.5 43.5 L34.5 39 C44 37.5 47.5 31 48 20.5 L44.5 21 Z" fill="url(#tridentGrad)" />
    <path d="M23 41.5 Q32 46.5 41 41.5 L39 45.5 Q32 49.5 25 45.5 Z" fill="#a5f3fc" opacity="0.92" />
    <rect x="27" y="49" width="10" height="2.6" rx="1.3" fill="#a5f3fc" />
    <rect x="28" y="54" width="8" height="2.2" rx="1.1" fill="#38e8ff" opacity="0.85" />
  </g>

  <!-- POSEIDON Wordmark -->
  <text x="138" y="70" font-family="Cinzel, Georgia, 'Times New Roman', serif" font-size="44" font-weight="800" letter-spacing="6" fill="url(#wordGrad)" filter="url(#glow)">POSEIDON</text>
  <text x="141" y="96" font-family="'Segoe UI', Inter, -apple-system, sans-serif" font-size="13.5" font-weight="600" letter-spacing="3.2" fill="#88acc0">CODING AGENT CLI &amp; WEB WORKBENCH</text>
</svg>
