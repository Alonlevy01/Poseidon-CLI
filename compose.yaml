services:
  poseidon:
    build:
      context: .
      dockerfile: Dockerfile
    image: poseidon-cli:dev
    env_file:
      - path: .env
        required: false
    group_add:
      - "0"
    volumes:
      - ./demo_workspace:/workspace
      - ./tests:/app/tests:ro
      - ./acceptance_tests:/app/acceptance_tests:ro
      - ./benchmarks:/app/benchmarks:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - poseidon_model_cache:/home/poseidon/.cache/fastembed
    stdin_open: true
    tty: true
    working_dir: /workspace

  poseidon-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: poseidon-sandbox:dev
    profiles:
      - build-only

volumes:
  poseidon_model_cache:
